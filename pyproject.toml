[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-application-agent"
version = "0.1.0"
description = "A local, review-gated internship application preparation agent"
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.2,<2",
  "pdfplumber>=0.11,<1",
]

[project.scripts]
internship-agent = "internship_agent.cli:main"

[tool.setuptools.packages.find]
include = ["internship_agent*"]
